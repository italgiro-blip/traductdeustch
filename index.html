<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Alemán B1 - Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">

    <div class="max-w-3xl mx-auto bg-white shadow-xl rounded-2xl p-6 md:p-8">
        
        <!-- Cabecera -->
        <header class="mb-6 border-b pb-4 flex justify-between items-center flex-wrap gap-2">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Traductor Instantáneo 🇩🇪 (Nivel B1)</h1>
                <p class="text-sm text-slate-500">Traducción mejorada, voz y análisis gramatical.</p>
            </div>
            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Sin Registro previo</span>
        </header>

        <!-- Controles -->
        <div class="space-y-4">
            <div>
                <label for="direccion" class="block text-sm font-medium text-slate-700 mb-1">Dirección:</label>
                <select id="direccion" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="es-de">Español ➔ Alemán</option>
                    <option value="de-es">Alemán ➔ Español</option>
                </select>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="texto" class="block text-sm font-medium text-slate-700">Texto o frase:</label>
                    <button type="button" onclick="iniciarVoz()" id="btnVoz" class="flex items-center gap-1.5 text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 font-medium px-3 py-1.5 rounded-lg border border-rose-200 transition">
                        🎙️ <span id="textoMic">Dictar por Voz</span>
                    </button>
                </div>
                <textarea id="texto" rows="3" placeholder="Escribe o dicta tu frase aquí..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>

            <button onclick="traducirConApi()" id="btnTraducir" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md">
                Traducir y Analizar (Nivel B1)
            </button>
        </div>

        <!-- Indicador de Carga -->
        <div id="loading" class="hidden mt-6 text-center text-slate-500 text-sm animate-pulse">
            Traduciendo al instante...
        </div>

        <!-- Resultados -->
        <div id="resultadoContainer" class="mt-8 hidden space-y-4 border-t pt-6">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Traducción:</h3>
                <button onclick="reproducirAudio()" class="flex items-center gap-1.5 text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-medium px-3 py-1.5 rounded-lg border border-emerald-200 transition">
                    🔊 Escuchar pronunciación
                </button>
            </div>
            <div id="traduccionTexto" class="mt-1 text-xl font-semibold text-slate-900 bg-slate-50 p-4 rounded-xl border"></div>

            <div>
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Orientación Gramatical B1:</h3>
                <div id="descripcionTexto" class="mt-1 text-sm text-slate-700 bg-blue-50 p-4 rounded-xl border border-blue-100 leading-relaxed"></div>
            </div>
        </div>

    </div>

    <script>
        // Reconocimiento de voz por el navegador
        function iniciarVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Tu navegador no soporta reconocimiento de voz. Usa Google Chrome o Edge.');
                return;
            }

            const recognition = new SpeechRecognition();
            const direccion = document.getElementById('direccion').value;
            recognition.lang = direccion === 'es-de' ? 'es-ES' : 'de-DE';
            
            const btnMic = document.getElementById('textoMic');
            btnMic.innerText = "Escuchando...";
            recognition.start();

            recognition.onresult = (event) => {
                document.getElementById('texto').value = event.results[0][0].transcript;
                btnMic.innerText = "Dictar por Voz";
            };
            recognition.onerror = () => { btnMic.innerText = "Dictar por Voz"; };
            recognition.onspeechend = () => { recognition.stop(); btnMic.innerText = "Dictar por Voz"; };
        }

        // Reproducir audio con la síntesis del navegador
        function reproducirAudio() {
            const texto = document.getElementById('traduccionTexto').innerText;
            const direccion = document.getElementById('direccion').value;
            const idioma = direccion === 'es-de' ? 'de-DE' : 'es-ES';

            if (!texto) return;
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = idioma;
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // Traducción utilizando diccionario rápido y API pública
        async function traducirConApi() {
            let textoOriginal = document.getElementById('texto').value.trim();
            let textoLimpio = textoOriginal.toLowerCase().replace(/[¿?¡!.,]/g, '').trim();
            const direccion = document.getElementById('direccion').value;

            if (!textoOriginal) {
                alert('Por favor escribe o dicta un texto.');
                return;
            }

            const loading = document.getElementById('loading');
            const resultadoContainer = document.getElementById('resultadoContainer');
            
            loading.classList.remove('hidden');
            resultadoContainer.classList.add('hidden');

            // Diccionario local para expresiones comunes
            const diccionarioExacto = {
                "buenos dias": "Guten Morgen",
                "buenos días": "Guten Morgen",
                "hola": "Hallo",
                "como estas": "Wie geht es dir?",
                "cómo estás": "Wie geht es dir?",
                "buenas tardes": "Guten Tag",
                "buenas noches": "Gute Nacht"
            };

            if (direccion === 'es-de' && diccionarioExacto[textoLimpio]) {
                const traduccion = diccionarioExacto[textoLimpio];
                document.getElementById('traduccionTexto').innerText = traduccion;
                document.getElementById('descripcionTexto').innerHTML = `
                    <strong>Análisis B1 sugerido:</strong><br>
                    • Saludo oficial preciso en alemán. <em>Guten Morgen</em> se utiliza específicamente desde las primeras horas de la mañana hasta el mediodía.
                `;
                loading.classList.add('hidden');
                resultadoContainer.classList.remove('hidden');
                return;
            }

            // Petición a la API pública de MyMemory
            let langPair = direccion === 'es-de' ? 'es|de' : 'de|es';
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(textoOriginal)}&langpair=${langPair}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.responseData) {
                    const traduccion = data.responseData.translatedText;
                    
                    document.getElementById('traduccionTexto').innerText = traduccion;
                    
                    if (direccion === 'es-de') {
                        document.getElementById('descripcionTexto').innerHTML = `
                            <strong>Análisis B1 sugerido:</strong><br>
                            • Revisa la colocación del verbo principal (en oraciones principales va en segunda posición, y en subordinadas al final).<br>
                            • Presta atención al género de los sustantivos (der/die/das) y los casos (Nominativo, Acusativo, Dativo).
                        `;
                    } else {
                        document.getElementById('descripcionTexto').innerHTML = `
                            <strong>Análisis B1 sugerido:</strong><br>
                            • Traducción al español obtenida de manera directa.<br>
                            • Identifica si el texto original contenía conectores intermedios frecuentes como <em>obwohl</em>, <em>deshalb</em> o <em>während</em>.
                        `;
                    }

                    resultadoContainer.classList.remove('hidden');
                } else {
                    throw new Error('No se pudo obtener la traducción.');
                }
            } catch (error) {
                alert('Ocurrió un error al traducir: ' + error.message);
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
